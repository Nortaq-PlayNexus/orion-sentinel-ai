version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      three-ecosystem:
        patterns:
          - 'three'
          - '@react-three/*'
      react-ecosystem:
        patterns:
          - 'react'
          - 'react-dom'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    labels:
      - dependencies
    commit-message:
      prefix: chore(ci)
